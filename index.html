<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remindr — Alarms, Tasks & Calendar for Android</title>
<meta name="description" content="Smart alarms, to-do tasks, calendar, quick notes & currency converter in one Android app.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=satoshi@400,500,600&display=swap">
<style>
  :root{
    --bg:#0A0B0E;
    --surface:#1E2126;
    --border:#2A2D33;
    --text:#F2F3F5;
    --text-secondary:#9AA0AC;
    --accent:#5E5CE6;
    --accent-soft:rgba(94,92,230,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Satoshi',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
    min-height:100vh;
  }
  /* faint star field, matching the app's own dark-mode background spec */
  .stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
  .stars span{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;}

  main{
    position:relative;
    z-index:1;
    max-width:560px;
    margin:0 auto;
    padding:80px 24px 48px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
  }

  .icon{
    width:132px;
    height:132px;
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
    margin-bottom:28px;
  }
  .icon img{width:100%;height:100%;display:block;}

  .platform{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--accent-soft);
    color:#A8A6F5;
    border:1px solid rgba(94,92,230,0.3);
    padding:5px 14px;
    border-radius:999px;
    font-family:'Satoshi',sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.02em;
    margin-bottom:20px;
  }
  .platform svg{width:13px;height:13px;}

  h1{
    font-family:'Clash Display',sans-serif;
    font-size:48px;
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0 0 14px;
  }

  p.tagline{
    font-size:17px;
    line-height:1.55;
    color:var(--text-secondary);
    margin:0 0 40px;
    max-width:420px;
  }

  .spacer{flex:1;}

  footer{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    padding-top:32px;
    border-top:1px solid var(--border);
    width:100%;
    max-width:420px;
  }
  footer a{
    color:var(--text-secondary);
    text-decoration:none;
    font-size:13px;
    transition:color 0.15s ease;
  }
  footer a:hover, footer a:focus-visible{color:var(--text);}
  footer .dot{color:var(--border);font-size:13px;}

  .copyright{
    margin-top:18px;
    font-size:12px;
    color:#5A5F68;
  }

  @media (max-width:480px){
    h1{font-size:36px;}
    .icon{width:108px;height:108px;border-radius:24px;}
    main{padding-top:56px;}
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<main>
  <div class="icon">
    <img src="assets/remindr-icon.png" alt="Remindr app icon" width="132" height="132">
  </div>

  <span class="platform">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.6 9.48l1.84-3.18a.5.5 0 00-.87-.5l-1.86 3.22a11.4 11.4 0 00-9.42 0L5.43 5.8a.5.5 0 00-.87.5L6.4 9.48A10.8 10.8 0 001 18h22a10.8 10.8 0 00-5.4-8.52zM7 14.5A1.5 1.5 0 118.5 13 1.5 1.5 0 017 14.5zm10 0a1.5 1.5 0 111.5-1.5 1.5 1.5 0 01-1.5 1.5z"/></svg>
    Android
  </span>

  <h1>Remindr<span style="color:var(--accent);">!</span></h1>
  <p class="tagline">Smart alarms, to-do tasks, calendar, quick notes &amp; currency converter — all in one app.</p>

  <div class="spacer"></div>

  <footer>
    <a href="privacy-policy.html">Privacy Policy</a>
    <span class="dot">&middot;</span>
    <a href="terms-of-service.html">Terms of Service</a>
  </footer>
  <div class="copyright">&copy; 2026 1DevProject</div>
</main>

<script>
  const field = document.getElementById('stars');
  const count = 40;
  for (let i = 0; i < count; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.opacity = (Math.random() * 0.5 + 0.15).toFixed(2);
    field.appendChild(s);
  }
</script>

</body>
</html>
